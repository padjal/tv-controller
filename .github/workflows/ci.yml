name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The scanner shells out to ffprobe for durations and ffmpeg for poster
      # frames. Both are optional at runtime and their tests skip when the
      # binaries are missing — install them so those tests actually run.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # `cargo test -p shared` rewrites dashboard/src/types/*.ts. If the
      # committed files differ, someone changed a shared type without
      # regenerating — the dashboard would be typechecking against a stale
      # contract.
      - name: Generated TypeScript is up to date
        run: git diff --exit-code -- dashboard/src/types/

  dashboard:
    name: Dashboard — typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image is the primary install path, and its dependency-cache stage
      # fabricates a dummy source tree that quietly breaks whenever a target is
      # added to a manifest. Build it, but do not push anything.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
