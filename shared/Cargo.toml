[package]
name    = "shared"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wire types shared by the TV Controller server and Pi agent; exports TypeScript via ts-rs"
repository  = "https://github.com/padjal/tv-controller"
# Workspace-internal crates with generic names; never published to crates.io.
publish = false

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
ts-rs      = { workspace = true, features = ["uuid-impl"] }

[[test]]
name = "ts_export"
