[package]
name    = "server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TV Controller central server: REST API, SSE stream, video indexing and device heartbeat"
repository  = "https://github.com/padjal/tv-controller"
# Workspace-internal crates with generic names; never published to crates.io.
publish = false

[dependencies]
shared             = { workspace = true }
tokio              = { workspace = true }
axum               = { workspace = true }
sqlx               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
percent-encoding   = { workspace = true }
notify             = { workspace = true }
reqwest            = { workspace = true }
futures            = { workspace = true }
tokio-stream       = { workspace = true }
tower-http         = { workspace = true }
uuid               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
