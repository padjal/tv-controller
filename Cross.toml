# Targets for `cross build --target <triple>` (see scripts/deploy_agent.sh).
#
# The table is `[target.<triple>]`. It was `[build.target.<triple>]`, which
# cross silently ignores — it warns "unused key(s) in Cross configuration".
#
# Each entry used to carry a `pre-build` installing libasound2-dev. Nothing in
# the dependency tree links ALSA (the agent shells out to mpv, which brings its
# own audio), so that was an apt-get per build for nothing. Add a `pre-build`
# here if a target ever does need system libraries.

[target.aarch64-unknown-linux-gnu]
# Pi 5 / Pi 4 (64-bit OS) / Pi 3 (64-bit OS)

[target.armv7-unknown-linux-gnueabihf]
# Pi 2/3/4/Zero 2W (ARMv7, 32-bit OS)

[target.arm-unknown-linux-gnueabihf]
# Pi 1 B+ / Zero W (ARMv6)
